version: '3.8'

services:
  # Container 1: Accessible on port 8080
  iacsd:
    build: .
    container_name: iacsd_container
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/var/www/html/index.html

  # Container 2: Accessible on port 8081
  itiss:
    build: .
    container_name: itiss_container
    ports:
      - "8081:80"
    volumes:
      - ./second.html:/var/www/html/index.html
